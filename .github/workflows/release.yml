name: Release

# Runs when anything lands on main, which includes a feature branch being
# merged. Doc-only changes are skipped so the README does not mint a release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:        # lets you cut a release by hand too

permissions:
  contents: write           # needed to create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false # never interrupt a release midway

jobs:
  # A separate job so the gate is visible in the UI and, more importantly, so
  # nothing in `release` can possibly run unless every check passed. Putting the
  # checks in the same job as the build relies on step ordering holding forever.
  test:
    name: Check for regressions
    runs-on: macos-14
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Run both check suites
        id: checks
        run: ./scripts/run-tests.sh

  release:
    name: Build and publish
    needs: test               # no green checks, no release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tags, so versions follow on from the last one

      - name: Work out the version
        id: version
        run: |
          # Patch number comes from the run number, so versions only ever climb
          # and two runs can never collide.
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build iPaint.app
        env:
          IPAINT_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Confirm the bundle is sound
        run: |
          test -x "iPaint.app/Contents/MacOS/iPaint"
          test -f "iPaint.app/Contents/Resources/iPaint.icns"
          PLIST="iPaint.app/Contents/Info.plist"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          if [ "$BUILT" != "${{ steps.version.outputs.version }}" ]; then
            echo "Info.plist says $BUILT, expected ${{ steps.version.outputs.version }}"
            exit 1
          fi
          # a bundle that will not launch is worse than no release at all
          codesign --verify --deep --strict iPaint.app
          echo "Bundle OK at version $BUILT"

      - name: Package
        run: |
          # ditto, not zip: it preserves bundle structure and resource forks
          ditto -c -k --sequesterRsrc --keepParent iPaint.app "iPaint-${{ steps.version.outputs.version }}.zip"
          shasum -a 256 "iPaint-${{ steps.version.outputs.version }}.zip" > checksum.txt
          cat checksum.txt

      - name: Confirm the packaged app unpacks intact
        run: |
          # Guards against shipping a zip that does not restore a working bundle.
          mkdir -p /tmp/verify
          ditto -x -k "iPaint-${{ steps.version.outputs.version }}.zip" /tmp/verify
          test -x /tmp/verify/iPaint.app/Contents/MacOS/iPaint
          codesign --verify --deep --strict /tmp/verify/iPaint.app
          echo "Packaged bundle verified"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHECKS: ${{ needs.test.outputs.checks }}
        run: |
          SHA=$(cut -d' ' -f1 checksum.txt)
          cat > notes.md <<EOF
          Built automatically from \`main\` (\`${GITHUB_SHA::7}\`) after
          **${CHECKS} checks** passed.

          ## Install

          1. Download \`iPaint-${VERSION}.zip\` below and unzip it.
          2. Drag **iPaint.app** to your Applications folder.
          3. First launch only: right-click iPaint and choose **Open**, then
             confirm. macOS shows a warning because the app is signed on the
             build machine rather than notarised by Apple.

          Requires macOS 14 or later.

          SHA-256: \`${SHA}\`
          EOF
          gh release create "$TAG" \
            "iPaint-${VERSION}.zip" \
            --title "iPaint $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
